name: Manual Builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.4.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(bun ./scripts/set-release-version.js "$RELEASE_VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Find previous stable release tag
        id: previous_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: v${{ steps.version.outputs.version }}
        run: |
          PREVIOUS_TAG=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease,publishedAt | bun -e '
            const fs = require("fs");
            const releases = JSON.parse(fs.readFileSync(0, "utf8"));
            const currentTag = process.env.CURRENT_TAG;
            const stable = releases
              .filter((item) => !item.isPrerelease && item.tagName !== currentTag)
              .sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
            process.stdout.write(stable[0]?.tagName || "");
          ')
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Using previous stable release tag: $PREVIOUS_TAG"
          else
            echo "No previous stable release found."
          fi

      - name: Generate release notes from commit subjects
        id: release_notes
        env:
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.previous_tag }}
        run: |
          NOTES_FILE="release_notes.md"
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:'- %s (%h)' "${PREVIOUS_TAG}..HEAD")
          else
            COMMITS=$(git log --pretty=format:'- %s (%h)' HEAD)
          fi

          {
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Since $PREVIOUS_TAG:"
              echo
            fi
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "- No new commits since last release."
            fi
          } > "$NOTES_FILE"

          NOTES_COUNT=$(printf "%s" "$COMMITS" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "notes_count=$NOTES_COUNT" >> "$GITHUB_OUTPUT"

      - name: Ensure draft release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
        run: |
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating title and notes."
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$NOTES_FILE"
          fi

  android:
    needs: prepare_release
    runs-on: ubuntu-latest
    env:
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
      EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
      EAS_NO_CREDENTIALS: 1
      RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply release version
        run: bun ./scripts/set-release-version.js "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: bun ci

      - name: Build Android AAB locally
        run: bunx eas-cli build --platform android --profile production --non-interactive --local --output=android-release.aab

      - name: Build Android APK locally
        run: bunx eas-cli build --platform android --profile production_apk --non-interactive --local --output=android-release.apk

      - name: Upload Android artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "android-release.aab" "android-release.apk" --clobber

  ios:
    needs: prepare_release
    runs-on: macos-latest
    env:
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
      EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply release version
        run: bun ./scripts/set-release-version.js "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}

      - name: Install dependencies
        run: bun ci

      - name: Restore local iOS signing credentials
        env:
          EAS_LOCAL_CREDENTIALS_JSON: ${{ secrets.EAS_LOCAL_CREDENTIALS_JSON }}
        run: |
          if [ -n "$EAS_LOCAL_CREDENTIALS_JSON" ]; then
            printf '%s' "$EAS_LOCAL_CREDENTIALS_JSON" > credentials.json
          else
            echo "No EAS_LOCAL_CREDENTIALS_JSON secret provided; using credentials.json from checkout if present."
          fi

      - name: Build iOS/iPadOS test IPA locally
        run: bunx eas-cli build --platform ios --profile test_ipa --non-interactive --local

      - name: Locate iOS artifact
        id: find_ios_artifact
        run: |
          find_latest() {
            python3 - "$@" <<'PY'
          import pathlib, sys

          root = pathlib.Path(sys.argv[1])
          exts = sys.argv[2:]
          paths = [p for ext in exts for p in root.rglob(f'*{ext}')]
          print(max(paths, key=lambda p: p.stat().st_mtime).resolve() if paths else "")
          PY
          }

          mkdir -p artifacts

          ARTIFACT=$(find_latest "." .ipa)

          if [ -z "$ARTIFACT" ]; then
            TAR=$(find_latest "." .tar.gz)
            if [ -n "$TAR" ]; then
              echo "Extracting $TAR to locate iOS artifact"
              TMPDIR=$(mktemp -d)
              tar -xzf "$TAR" -C "$TMPDIR"
              INNER=$(find_latest "$TMPDIR" .ipa)
              if [ -n "$INNER" ]; then
                DEST="artifacts/$(basename "$INNER")"
                cp "$INNER" "$DEST"
                ARTIFACT="$DEST"
              fi
            fi
          fi

          if [ -z "$ARTIFACT" ]; then
            echo "No iOS artifact found"
            exit 1
          fi
          echo "path=$ARTIFACT" >> "$GITHUB_OUTPUT"
          ls -lh "$ARTIFACT"

      - name: Upload iOS artifact to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.find_ios_artifact.outputs.path }}" --clobber

  desktop_windows:
    needs: prepare_release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply release version
        run: bun ./scripts/set-release-version.js "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}

      - name: Install dependencies
        run: bun ci

      - name: Build desktop Windows package
        run: bun run desktop:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Upload Windows artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=()
          installer=""

          if [ -f dist/latest.yml ]; then
            installer=$(sed -n 's/^path: //p' dist/latest.yml | head -n 1)
            if [ -n "$installer" ] && [ -f "dist/$installer" ]; then
              files+=("dist/$installer")
            fi
          fi

          if [ ${#files[@]} -eq 0 ]; then
            while IFS= read -r -d '' file; do
              files+=("$file")
              break
            done < <(find dist -maxdepth 1 -type f -name '*-Setup-*.exe' -print0)
          fi

          if [ ${#files[@]} -eq 0 ]; then
            while IFS= read -r -d '' file; do
              files+=("$file")
              break
            done < <(find dist -maxdepth 1 -type f -name '*.Setup.*.exe' -print0)
          fi

          if [ ${#files[@]} -eq 0 ]; then
            while IFS= read -r -d '' file; do
              files+=("$file")
              break
            done < <(find dist -maxdepth 1 -type f -name '*.exe' -print0)
          fi

          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -maxdepth 1 -type f \( -name '*.msi' -o -name '*.zip' \) -print0)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows artifacts found in dist/"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
        shell: bash

  desktop_linux:
    needs: prepare_release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply release version
        run: bun ./scripts/set-release-version.js "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}

      - name: Install dependencies
        run: bun ci

      - name: Build desktop Linux package
        run: bun run desktop:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.deb dist/*.rpm dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux artifacts found in dist/"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  desktop_macos:
    needs: prepare_release
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply release version
        run: bun ./scripts/set-release-version.js "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}

      - name: Install dependencies
        run: bun ci

      - name: Build desktop macOS test DMG
        run: bun run desktop:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS artifacts found in dist/"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
