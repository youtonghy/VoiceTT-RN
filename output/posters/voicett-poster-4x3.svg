<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">VoiceTT 4:3 poster</title>
  <desc id="desc">A clean minimal Chinese poster introducing VoiceTT features and the GitHub repository.</desc>
  <defs>
    <linearGradient id="micBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD95A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20C7D4"/>
      <stop offset="1" stop-color="#087E8B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .font { font-family: "STHeiti", "PingFang SC", "Arial Unicode MS", "Noto Sans CJK SC", sans-serif; }
      .headline { font-size: 104px; font-weight: 800; fill: #111827; }
      .subtitle { font-size: 35px; font-weight: 500; fill: #364152; }
      .section { font-size: 30px; font-weight: 800; fill: #111827; }
      .feature-title { font-size: 27px; font-weight: 760; fill: #111827; }
      .feature-copy { font-size: 21px; font-weight: 420; fill: #5B6575; }
      .small { font-size: 22px; font-weight: 650; fill: #111827; }
      .mono { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 20px; font-weight: 700; fill: #111827; }
      .caption { font-size: 18px; font-weight: 520; fill: #697386; }
      .panel-text { font-size: 21px; font-weight: 560; fill: #364152; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#F7FAFC"/>
  <circle cx="1375" cy="185" r="210" fill="#DDF7FA" opacity="0.68"/>
  <circle cx="1280" cy="930" r="230" fill="#FFF2C2" opacity="0.58"/>
  <circle cx="119" cy="1012" r="155" fill="#FFE5EF" opacity="0.5"/>
  <path d="M1120 80 C1314 118 1495 273 1497 502 C1498 680 1410 787 1295 867 C1185 944 1003 987 877 898 C731 795 729 571 796 397 C856 243 948 47 1120 80Z" fill="#ECFEFF" opacity="0.74"/>

  <g class="font" transform="translate(108 92)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="142" height="50" rx="25" fill="#111827"/>
      <circle cx="31" cy="25" r="12" fill="#20C7D4"/>
      <path d="M55 31 C72 7 97 7 114 31" fill="none" stroke="#FFD95A" stroke-width="8" stroke-linecap="round"/>
      <text x="160" y="35" class="small">开源语音工作台</text>
    </g>

    <text x="0" y="166" class="headline">VoiceTT</text>
    <text x="4" y="222" class="subtitle">转写优先的跨平台语音助手</text>
    <text x="4" y="280" class="subtitle">实时录音转写 · 翻译 · 摘要 · QA · 历史检索</text>

    <g transform="translate(0 366)">
      <text x="0" y="0" class="section">核心功能</text>

      <g transform="translate(0 58)">
        <circle cx="18" cy="18" r="18" fill="#DDF7FA"/>
        <path d="M11 19 L17 25 L27 11" fill="none" stroke="#0A8F9C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="54" y="10" class="feature-title">实时录音与分段转写</text>
        <text x="54" y="45" class="feature-copy">多种转写引擎可切换，适合会议、访谈和课堂记录</text>
      </g>

      <g transform="translate(0 150)">
        <circle cx="18" cy="18" r="18" fill="#FFF2C2"/>
        <path d="M10 22 H27 M14 14 H30 M17 9 C17 26 27 27 30 31" fill="none" stroke="#C27803" stroke-width="4" stroke-linecap="round"/>
        <text x="54" y="10" class="feature-title">翻译与摘要</text>
        <text x="54" y="45" class="feature-copy">按目标语言配置翻译，并生成会话标题与摘要</text>
      </g>

      <g transform="translate(0 242)">
        <circle cx="18" cy="18" r="18" fill="#FFE5EF"/>
        <path d="M12 13 H25 M12 22 H30 M12 31 H21" fill="none" stroke="#D94683" stroke-width="4" stroke-linecap="round"/>
        <text x="54" y="10" class="feature-title">QA 要点提取</text>
        <text x="54" y="45" class="feature-copy">对完成片段做自动或手动分析，提炼问题与行动项</text>
      </g>

      <g transform="translate(0 334)">
        <circle cx="18" cy="18" r="18" fill="#E9EEFF"/>
        <path d="M13 14 H27 M13 22 H27 M13 30 H22" fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>
        <text x="54" y="10" class="feature-title">历史会话检索</text>
        <text x="54" y="45" class="feature-copy">按日期分组、搜索、切换会话，并可继续记录</text>
      </g>
    </g>

    <g transform="translate(0 860)">
      <rect x="0" y="0" width="720" height="116" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#softShadow)"/>
      <g transform="translate(30 26)">
        <circle cx="33" cy="33" r="32" fill="#111827"/>
        <path d="M18 32 C18 23 25 16 34 16 C43 16 50 23 50 32 C50 43 43 51 34 51 C25 51 18 43 18 32Z" fill="#FFFFFF"/>
        <rect x="22" y="43" width="24" height="8" rx="4" fill="#111827"/>
      </g>
      <text x="92" y="44" class="small">下载仓库</text>
      <text x="92" y="80" class="mono" font-size="20">github.com/youtonghy/VoiceTT-RN</text>
      <g transform="translate(585 27)">
        <rect x="0" y="0" width="88" height="62" rx="18" fill="#ECFEFF"/>
        <path d="M23 31 H58 M46 18 L59 31 L46 44" fill="none" stroke="#087E8B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <g class="font" transform="translate(850 160)">
    <g filter="url(#softShadow)">
      <rect x="45" y="110" width="535" height="650" rx="44" fill="#FFFFFF" stroke="#E6EAF0" stroke-width="2"/>
      <rect x="84" y="154" width="457" height="88" rx="28" fill="#111827"/>
      <text x="119" y="208" fill="#FFFFFF" font-size="29" font-weight="780">Live Transcript</text>
      <circle cx="502" cy="198" r="13" fill="#20C7D4"/>

      <g transform="translate(103 295)">
        <rect x="0" y="0" width="342" height="22" rx="11" fill="#DDE3EA"/>
        <rect x="0" y="44" width="398" height="22" rx="11" fill="#EEF2F7"/>
        <rect x="0" y="88" width="284" height="22" rx="11" fill="#EEF2F7"/>
      </g>
      <g transform="translate(103 451)">
        <rect x="0" y="0" width="86" height="34" rx="17" fill="#DDF7FA"/>
        <text x="17" y="25" class="caption" fill="#087E8B">翻译</text>
        <rect x="106" y="0" width="86" height="34" rx="17" fill="#FFF2C2"/>
        <text x="123" y="25" class="caption" fill="#B45309">摘要</text>
        <rect x="212" y="0" width="66" height="34" rx="17" fill="#FFE5EF"/>
        <text x="232" y="25" class="caption" fill="#BE185D">QA</text>
      </g>
      <g transform="translate(103 548)">
        <rect x="0" y="0" width="400" height="122" rx="28" fill="#F8FAFC" stroke="#E5E7EB"/>
        <text x="28" y="43" class="panel-text">会议重点已整理</text>
        <text x="28" y="80" class="caption">标题 · 摘要 · 待办</text>
      </g>
    </g>

    <g transform="translate(290 555)">
      <ellipse cx="152" cy="270" rx="192" ry="34" fill="#CBD5E1" opacity="0.38"/>
      <path d="M37 75 V165 C37 230 88 281 153 281 C218 281 269 230 269 165 V75" fill="none" stroke="url(#teal)" stroke-width="44" stroke-linecap="round"/>
      <rect x="131" y="260" width="45" height="140" rx="22" fill="#0E98A5"/>
      <rect x="68" y="380" width="169" height="45" rx="22" fill="#111827"/>
      <rect x="74" y="-40" width="156" height="285" rx="78" fill="url(#micBody)"/>
      <path d="M74 34 C111 15 192 16 230 34 V101 H74Z" fill="#CDD5E1"/>
      <rect x="74" y="101" width="156" height="48" fill="#FFFFFF"/>
      <path d="M74 34 C114 96 162 119 230 101 V34 C192 16 111 15 74 34Z" fill="#B8C0D1" opacity="0.42"/>
      <circle cx="37" cy="118" r="12" fill="#D94683"/>
      <circle cx="269" cy="118" r="12" fill="#D94683"/>
      <path d="M-28 86 C-64 122 -64 171 -29 206" fill="none" stroke="#20C7D4" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
      <path d="M334 86 C370 122 370 171 335 206" fill="none" stroke="#20C7D4" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
    </g>

    <g transform="translate(625 170)" opacity="0.9">
      <path d="M0 35 L22 42 L34 64 L46 42 L69 35 L46 26 L34 4 L22 26Z" fill="#FFD95A"/>
      <circle cx="90" cy="119" r="13" fill="#20C7D4"/>
      <path d="M-11 158 H33 M11 136 V180" stroke="#D94683" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <g class="font" transform="translate(108 1113)">
    <text x="0" y="0" class="caption">Expo / React Native · Electron Desktop · 本地历史 · 多引擎配置 · i18n</text>
    <text x="1110" y="0" text-anchor="end" class="caption">Quick start: bun install  ·  bunx expo start</text>
  </g>
</svg>
